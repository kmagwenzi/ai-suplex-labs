    <rect x="0" y="0" width="536" height="556" rx="8" class="surface" />
    <text x="22" y="30" class="ink" font-size="15" font-weight="600">&#9662; New workspace</text>
    <text x="22" y="50" class="muted" font-size="12">Opens a Project or Quick Task lane — one context file and one tasklist, written by</text>
    <text x="22" y="66" class="muted" font-size="12">the vault through suplex_workspace_create. The board refreshes after the write.</text>

    <!-- Field 1: LANE -->
    <text x="22" y="94" class="muted mono" font-size="10" letter-spacing="0.5">LANE</text>
    <rect x="22" y="100" width="492" height="34" rx="6" class="surface2" />
    <text x="34" y="121" class="ink" font-size="13" font-weight="500">Quick Task</text>
    <text x="494" y="121" class="muted" font-size="12">&#9662;</text>

    <!-- Field 2: TITLE -->
    <text x="22" y="152" class="muted mono" font-size="10" letter-spacing="0.5">TITLE</text>
    <rect x="22" y="158" width="492" height="34" rx="6" class="surface2" />
    <text x="34" y="179" class="ink" font-size="13">Quick wins</text>

    <!-- Field 3: SLUG -->
    <text x="22" y="210" class="muted mono" font-size="10" letter-spacing="0.5">SLUG</text>
    <rect x="22" y="216" width="492" height="34" rx="6" class="surface2" />
    <text x="34" y="237" class="ink mono" font-size="12.5">quick-wins</text>

    <!-- Field 4: MISSION -->
    <text x="22" y="268" class="muted mono" font-size="10" letter-spacing="0.5">MISSION</text>
    <rect x="22" y="274" width="492" height="48" rx="6" class="surface2" />
    <text x="34" y="295" class="ink" font-size="12.5">Execute immediate client follow-ups and close open quick-win tasks</text>

    <!-- Field 5: TASKS -->
    <text x="22" y="340" class="muted mono" font-size="10" letter-spacing="0.5">TASKS (ONE PER LINE, OPTIONAL)</text>
    <rect x="22" y="346" width="492" height="58" rx="6" class="surface2" />
    <text x="34" y="367" class="ink mono" font-size="12">review open leads in vault</text>
    <text x="34" y="386" class="ink mono" font-size="12">send demo link and record episode outcome</text>

    <!-- Submit Button -->
    <rect x="22" y="418" width="128" height="32" rx="6" class="accent-bg" />
    <text x="86" y="438" text-anchor="middle" class="on-accent" font-size="13">Open workspace</text>

    <!-- P009 Created Confirmation Receipt -->
    <rect x="22" y="464" width="492" height="74" rx="6" class="surface-ok" />
    <text x="36" y="486" class="ink" font-size="12.5" font-weight="600">Opened ref 3</text>
    <text x="36" y="506" class="muted mono" font-size="11.5">Context Kick-start/Active/random-tasks-3-quick-wins.md</text>
    <text x="36" y="524" class="muted mono" font-size="11.5">Tasklists/2026-11-18-random-tasks-3-quick-wins-tasklist.md</text>

    <!-- Right Column: Live Workspaces Board (Refreshed after write) -->
    <g transform="translate(556, 0)">
      <!-- Quick Task Section (Showing newly created quick-wins · ref 3) -->
      <rect x="0" y="0" width="548" height="196" rx="8" class="surface" />
      <text x="20" y="28" class="ink" font-size="15" font-weight="600">Quick Task</text>
      <text x="528" y="28" text-anchor="end" class="muted mono" font-size="11">1 WORKSPACE</text>

      <rect x="20" y="44" width="508" height="132" rx="6" class="surface2" />
      <text x="34" y="68" class="ink" font-size="14" font-weight="600">quick-wins</text>
      <text x="116" y="68" class="accent-text mono" font-size="10.5" font-weight="600">OPEN</text>
      <text x="160" y="68" class="muted mono" font-size="10.5">REF 3</text>
      <text x="34" y="88" class="muted mono" font-size="11.5">Context Kick-start/Active/random-tasks-3-quick-wins.md</text>
      <text x="34" y="110" class="ink2 mono" font-size="11">WRITER <tspan class="ink" font-weight="500">Hustler</tspan>   AGENT <tspan class="ink" font-weight="500">Claude Code</tspan>   OPENED <tspan class="ink" font-weight="500">2026-11-18</tspan>   AGE <tspan class="ink" font-weight="500">0d</tspan></text>
      <text x="34" y="136" class="ink2" font-size="12.5">Execute immediate client follow-ups and close open quick-win tasks</text>

      <!-- Daily Work Section -->
      <rect x="0" y="212" width="548" height="164" rx="8" class="surface" />
      <text x="20" y="240" class="ink" font-size="15" font-weight="600">Daily Work</text>
      <text x="528" y="240" text-anchor="end" class="muted mono" font-size="11">1 WORKSPACE</text>

      <rect x="20" y="256" width="508" height="102" rx="6" class="surface2" />
      <text x="34" y="280" class="ink" font-size="14" font-weight="600">Daily Work</text>
      <text x="114" y="280" class="accent-text mono" font-size="10.5" font-weight="600">OPEN</text>
      <text x="156" y="280" class="muted mono" font-size="11">singleton</text>
      <text x="34" y="300" class="muted mono" font-size="11.5">Context Kick-start/Active/daily-tasks.md</text>
      <text x="34" y="322" class="ink2 mono" font-size="11">WRITER <tspan class="ink" font-weight="500">Hustler (Daily Tasks)</tspan>   OPENED <tspan class="ink" font-weight="500">2026-11-18</tspan>   AGE <tspan class="ink" font-weight="500">0d</tspan></text>

      <!-- Project Section (Collapsed at 3 with truthful count) -->
      <rect x="0" y="392" width="548" height="164" rx="8" class="surface" />
      <text x="20" y="420" class="ink" font-size="15" font-weight="600">Project</text>
      <text x="528" y="420" text-anchor="end" class="muted mono" font-size="11">8 WORKSPACES</text>

      <rect x="20" y="436" width="508" height="84" rx="6" class="surface2" />
      <text x="34" y="460" class="ink" font-size="14" font-weight="600">ai-suplex-launch-lattice</text>
      <text x="210" y="460" class="accent-text mono" font-size="10.5" font-weight="600">OPEN</text>
      <text x="34" y="480" class="muted mono" font-size="11.5">Context Kick-start/Active/project-tasks-18-ai-suplex-launch-lattice.md</text>
      <text x="34" y="502" class="ink2 mono" font-size="11">WRITER <tspan class="ink" font-weight="500">Builder</tspan>   OPENED <tspan class="ink" font-weight="500">2026-11-18</tspan>   AGE <tspan class="ink" font-weight="500">0d</tspan></text>
      <text x="20" y="540" class="accent-text mono" font-size="12" font-weight="600">show all 8</text>
    </g>
  </g>
</svg>
