<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="AI-Suplex 777 Workflow Console showing New workspace created: Quick Task, quick-wins, ref 3">
  <defs>
    <style>
      .bg { fill: #f6f4f0; }
      .surface { fill: #ffffff; stroke: #e5e1da; stroke-width: 1; }
      .surface2 { fill: #eeebe5; stroke: #e5e1da; stroke-width: 1; }
      .surface-ok { fill: #edf5f0; stroke: #b7d7c4; stroke-width: 1; }
      .chrome { fill: #15223a; }
      .ink { fill: #1b1916; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .ink2 { fill: #4a4640; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .muted { fill: #6f6a61; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .accent-bg { fill: #1d6b3f; }
      .accent-text { fill: #14502e; }
      .on-accent { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; font-weight: 600; }
      .hairline { stroke: #e5e1da; stroke-width: 1; }
    </style>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="1200" height="760" rx="10" class="bg" />
  <rect width="1200" height="38" rx="10" class="chrome" />
  <rect y="28" width="1200" height="10" class="chrome" />
  <circle cx="22" cy="19" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="40" cy="19" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="58" cy="19" r="5.5" fill="#10b981" opacity="0.85" />
  <rect x="380" y="7" width="440" height="24" rx="5" fill="#1a2947" />
  <text x="600" y="23" text-anchor="middle" fill="#cbd5e1" class="mono" font-size="11.5">http://localhost:3000/workspaces — offline verified</text>

  <!-- Console Header Bar -->
  <g transform="translate(48, 54)">
    <!-- Logo Tile -->
    <rect x="0" y="2" width="28" height="28" rx="6" fill="#1a2947" />
    <path d="M7.5 19.5 L14 8.5 L20.5 19.5" fill="none" stroke="#b8862e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="15" class="ink" font-size="15" font-weight="600">AI-Suplex 777</text>
    <text x="38" y="29" class="muted mono" font-size="10.5" letter-spacing="0.5">WORKFLOW CONSOLE</text>

    <!-- Nav items -->
    <g transform="translate(230, 6)">
      <text x="0" y="15" class="ink2" font-size="13">Today</text>
      <text x="58" y="15" class="ink2" font-size="13">Pipeline</text>
      <rect x="122" y="-2" width="92" height="24" rx="6" fill="#eeebe5" />
      <text x="132" y="15" class="ink" font-size="13" font-weight="600">Workspaces</text>
      <text x="228" y="15" class="ink2" font-size="13">Commands</text>
      <text x="316" y="15" class="ink2" font-size="13">Session</text>
      <text x="384" y="15" class="ink2" font-size="13">Memory</text>
      <text x="454" y="15" class="ink2" font-size="13">Guides</text>
      <text x="516" y="15" class="ink2" font-size="13">Setup</text>
    </g>

    <!-- Runtime & MCP Health -->
    <g transform="translate(880, 6)">
      <text x="0" y="15" class="muted mono" font-size="11">RUNTIME: VAULT-NATIVE</text>
      <circle cx="168" cy="11" r="4" fill="#1d6b3f" />
      <text x="178" y="15" class="ink2 mono" font-size="12">11ms</text>
    </g>

    <line x1="0" y1="44" x2="1104" y2="44" class="hairline" />
  </g>

  <!-- Top Action Strip -->
  <g transform="translate(48, 116)">
    <rect x="0" y="0" width="132" height="30" rx="6" class="accent-bg" />
    <text x="66" y="19" text-anchor="middle" class="on-accent" font-size="12.5">Define Workspace</text>

    <rect x="142" y="0" width="146" height="30" rx="6" class="surface" />
    <text x="215" y="19" text-anchor="middle" class="ink2" font-size="12.5">Kickstart Workspace</text>

    <rect x="1002" y="0" width="102" height="30" rx="6" class="surface" />
    <text x="1053" y="19" text-anchor="middle" class="ink2" font-size="12.5">Show closed</text>
  </g>

  <!-- Main Content Grid: Left = New Workspace Form + P009 Receipt, Right = Workspaces Board -->
  <g transform="translate(48, 162)">
