<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Architectural monochrome / modern) -->
    <linearGradient id="staloneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="60%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>

    <!-- Plaid / Checkered Suit Fabric -->
    <pattern id="plaidPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#4B5563"/>
      <!-- Windowpane fine check lines -->
      <line x1="0" y1="20" x2="40" y2="20" stroke="#9CA3AF" stroke-width="1.2" opacity="0.6"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#9CA3AF" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#374151" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#374151" stroke-width="2"/>
    </pattern>

    <!-- Micro-dot Shirt Pattern -->
    <pattern id="microDotPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#F8FAFC"/>
      <circle cx="6" cy="6" r="1.2" fill="#94A3B8"/>
    </pattern>

    <!-- Skin Tone Stalone (Warm front-lit) -->
    <radialGradient id="faceShadeStalone" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7C4A2D"/>
      <stop offset="65%" stop-color="#5B331C"/>
      <stop offset="100%" stop-color="#3D2010"/>
    </radialGradient>

    <linearGradient id="tieGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#staloneBg)"/>
  
  <!-- Architectural background bars (from the photo background) -->
  <g opacity="0.2" stroke="#475569" stroke-width="4">
    <line x1="80" y1="50" x2="80" y2="350"/>
    <line x1="140" y1="50" x2="140" y2="350"/>
    <line x1="60" y1="120" x2="180" y2="120"/>
    <line x1="60" y1="200" x2="180" y2="200"/>
  </g>

  <!-- Shoulders & Tailored Suit Jacket -->
  <path d="M 60 600 L 170 330 L 430 330 L 540 600 Z" fill="url(#plaidPattern)"/>
  
  <!-- Jacket Lapels -->
  <path d="M 170 330 L 255 470 L 225 600 L 120 600 Z" fill="#374151" opacity="0.95"/>
  <path d="M 430 330 L 345 470 L 375 600 L 480 600 Z" fill="#374151" opacity="0.95"/>

  <!-- Crisp Collared Shirt (V-neck opening) -->
  <polygon points="255,330 345,330 315,500 285,500" fill="url(#microDotPattern)"/>

  <!-- Shirt Collars -->
  <!-- Left collar -->
  <polygon points="255,320 295,355 270,380" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Right collar -->
  <polygon points="345,320 305,355 330,380" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Necktie -->
  <!-- Tie knot -->
  <polygon points="293,355 307,355 304,375 296,375" fill="url(#tieGrad)"/>
  <!-- Tie blade -->
  <polygon points="296,375 304,375 314,560 300,580 286,560" fill="url(#tieGrad)"/>

  <!-- Neck -->
  <path d="M 265 260 L 265 335 C 285 345, 315 345, 335 335 L 335 260 Z" fill="#4B2813"/>

  <!-- Head (Front-facing oval, slight angle, smiling warmly) -->
  <ellipse cx="300" cy="195" rx="55" ry="72" fill="url(#faceShadeStalone)"/>

  <!-- Short hair -->
  <path d="M 245 190 C 240 120, 360 120, 355 190 C 350 140, 250 140, 245 190 Z" fill="#111827"/>
  <path d="M 248 160 C 255 125, 345 125, 352 160 C 342 135, 258 135, 248 160 Z" fill="#030712"/>

  <!-- Ears -->
  <ellipse cx="242" cy="200" rx="7" ry="14" fill="#522C16"/>
  <ellipse cx="358" cy="200" rx="7" ry="14" fill="#522C16"/>

  <!-- Eyebrows -->
  <path d="M 264 175 Q 278 170 290 174" stroke="#111827" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 310 174 Q 322 170 336 175" stroke="#111827" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Warm, engaging, gentle smile crinkles) -->
  <!-- Left eye -->
  <ellipse cx="278" cy="186" rx="7" ry="4.5" fill="#FFFFFF"/>
  <circle cx="278" cy="186" r="3.5" fill="#1C1917"/>
  <circle cx="279" cy="185" r="1" fill="#FFFFFF"/>
  <path d="M 270 182 Q 278 180 286 182" stroke="#1C1917" stroke-width="1.8" fill="none"/>

  <!-- Right eye -->
  <ellipse cx="322" cy="186" rx="7" ry="4.5" fill="#FFFFFF"/>
  <circle cx="322" cy="186" r="3.5" fill="#1C1917"/>
  <circle cx="323" cy="185" r="1" fill="#FFFFFF"/>
  <path d="M 314 182 Q 322 180 330 182" stroke="#1C1917" stroke-width="1.8" fill="none"/>

  <!-- Nose -->
  <path d="M 295 188 L 293 214 Q 300 219 307 214 L 305 188" stroke="#42210E" stroke-width="1.5" fill="none"/>
  <ellipse cx="293" cy="214" rx="2.5" ry="1.5" fill="#241107"/>
  <ellipse cx="307" cy="214" rx="2.5" ry="1.5" fill="#241107"/>

  <!-- Smile / Mouth (Broad, warm, confident teeth visible) -->
  <path d="M 280 236 Q 300 262 320 236 Q 300 242 280 236 Z" fill="#241006"/>
  <!-- Teeth -->
  <path d="M 284 237 Q 300 248 316 237 Q 300 240 284 237 Z" fill="#F8FAFC"/>
  <!-- Lower lip -->
  <path d="M 285 244 Q 300 255 315 244" stroke="#522712" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Light goatee / chin beard -->
  <path d="M 292 258 C 295 264, 305 264, 308 258 C 308 266, 292 266, 292 258 Z" fill="#111827"/>

  <!-- Highlighting & Warm Glow -->
  <ellipse cx="300" cy="155" rx="25" ry="12" fill="rgba(255,255,255,0.08)"/>
</svg>
