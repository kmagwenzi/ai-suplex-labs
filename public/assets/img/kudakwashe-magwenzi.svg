<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="15%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Timber overhang ceiling -->
    <linearGradient id="woodBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="25%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#451A03"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Olive Bomber Jacket -->
    <linearGradient id="bomberJacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#556545"/>
      <stop offset="50%" stop-color="#3F4D33"/>
      <stop offset="100%" stop-color="#2D3724"/>
    </linearGradient>

    <!-- Grey Henley -->
    <linearGradient id="greyHenley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Skin Tone Kudakwashe (Three-quarter profile) -->
    <linearGradient id="skinKuda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6E432B"/>
      <stop offset="45%" stop-color="#54311C"/>
      <stop offset="100%" stop-color="#3B2011"/>
    </linearGradient>

    <radialGradient id="faceShade" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#7B4C30"/>
      <stop offset="70%" stop-color="#54311C"/>
      <stop offset="100%" stop-color="#2E180B"/>
    </radialGradient>
  </defs>

  <!-- Background Studio Environment -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <!-- Wooden beam roof -->
  <rect width="600" height="75" fill="url(#woodBeam)"/>
  <rect y="72" width="600" height="6" fill="#1C1917" opacity="0.4"/>

  <!-- Torso & Shoulders -->
  <!-- Dark Navy Trousers visible at base -->
  <path d="M 210 520 L 390 520 L 410 600 L 190 600 Z" fill="#0F172A"/>

  <!-- Olive Bomber Jacket -->
  <!-- Left arm & body -->
  <path d="M 80 600 L 170 340 L 250 330 L 260 480 L 180 600 Z" fill="url(#bomberJacket)"/>
  <!-- Right arm & body -->
  <path d="M 520 600 L 430 340 L 350 330 L 340 480 L 420 600 Z" fill="url(#bomberJacket)"/>
  <!-- Outer jacket main body -->
  <path d="M 170 340 C 230 320, 370 320, 430 340 L 450 600 L 150 600 Z" fill="url(#bomberJacket)"/>

  <!-- Grey Henley Center Placket -->
  <path d="M 255 330 Q 300 355 345 330 L 355 540 L 245 540 Z" fill="url(#greyHenley)"/>
  <!-- Henley placket strip & buttons -->
  <line x1="300" y1="345" x2="300" y2="440" stroke="#64748B" stroke-width="4"/>
  <circle cx="300" cy="365" r="4" fill="#334155"/>
  <circle cx="300" cy="395" r="4" fill="#334155"/>
  <circle cx="300" cy="425" r="4" fill="#334155"/>

  <!-- Blue round pin / badge on left chest -->
  <circle cx="330" cy="415" r="9" fill="#2563EB"/>
  <circle cx="330" cy="415" r="5" fill="#60A5FA"/>

  <!-- Jacket ribbed collar -->
  <path d="M 235 340 C 275 375, 325 375, 365 340 L 350 320 C 320 345, 280 345, 250 320 Z" fill="#1C1917"/>

  <!-- Neck -->
  <path d="M 268 270 L 268 340 C 290 350, 315 350, 335 340 L 335 270 Z" fill="#452715"/>
  <path d="M 305 275 L 335 340 L 310 345 Z" fill="#2E180B" opacity="0.4"/>

  <!-- Head (three-quarter angle, facing slightly right) -->
  <path d="M 255 190 C 250 250, 275 305, 310 305 C 345 305, 360 250, 355 190 C 355 130, 255 130, 255 190 Z" fill="url(#faceShade)"/>

  <!-- Short buzz cut / fade hair -->
  <path d="M 245 190 C 240 120, 355 110, 360 175 C 362 195, 352 195, 350 175 C 340 130, 255 140, 250 190 Z" fill="#111827"/>
  <path d="M 246 185 C 243 145, 280 125, 320 125 C 345 125, 358 135, 360 160 C 352 145, 335 135, 310 135 C 275 135, 252 155, 246 185 Z" fill="#030712"/>

  <!-- Ear (left in view) -->
  <path d="M 252 215 C 245 215, 243 235, 252 245 C 255 240, 256 225, 252 215 Z" fill="#4D2A16"/>

  <!-- Facial Profile & Features -->
  <!-- Eyebrow & Eyes (looking right) -->
  <path d="M 295 190 Q 320 185 342 192" stroke="#111827" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Eye -->
  <ellipse cx="325" cy="202" rx="7" ry="4" fill="#FFFFFF"/>
  <circle cx="327" cy="202" r="3.5" fill="#18181B"/>
  <circle cx="328" cy="200" r="1" fill="#FFFFFF"/>

  <!-- Nose Bridge & Tip (facing right) -->
  <path d="M 328 195 L 340 228 L 332 232 Z" fill="#3D2010"/>
  <path d="M 326 200 L 335 225" stroke="#78472B" stroke-width="2" stroke-linecap="round"/>

  <!-- Lips & Mouth -->
  <path d="M 322 254 Q 334 253 342 256" stroke="#2B150A" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Neatly trimmed goatee / chin beard -->
  <path d="M 305 270 C 315 285, 335 285, 342 268 C 342 288, 325 305, 310 305 C 295 305, 290 295, 305 270 Z" fill="#111827"/>
  <path d="M 320 248 Q 332 248 338 250" stroke="#111827" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Subtle Rim Lighting -->
  <path d="M 248 160 C 248 135, 275 125, 300 125" stroke="rgba(255,255,255,0.25)" stroke-width="3" fill="none"/>
</svg>
